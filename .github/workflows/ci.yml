name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-mcp:
    name: server + mcp (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install server dependencies
        run: pip install -r server/requirements.txt
      - name: Run pytest (server + mcp)
        run: python -m pytest tests/ -q

  sdk:
    name: sdk (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run SDK test suite
        working-directory: sdk
        run: node --test test/sdk.test.mjs

  wp:
    name: wordpress plugin (php -l)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
      - name: Lint plugin PHP (php -l)
        run: |
          set -e
          while IFS= read -r -d '' f; do
            php -l "$f"
          done < <(find wp/crumbs-attribution -name '*.php' -print0)
